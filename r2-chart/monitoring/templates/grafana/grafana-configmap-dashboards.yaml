apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-grafana-configmap-dashboards" (include "monitoring.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: monitoring
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  custom-dashboard.json: |
{{ .Files.Get "grafana-dashboard/custom-dashboard.json" | indent 4 }}
  node-exporter-full-rev45.json: |
{{ .Files.Get "grafana-dashboard/node-exporter-full-rev45.json" | indent 4 }}
