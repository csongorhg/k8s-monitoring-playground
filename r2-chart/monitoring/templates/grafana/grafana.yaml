apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: >-
            {{ printf "%s:%s"
              .Values.grafana.image.repository
              .Values.grafana.image.tag
            }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-pass
            # This was added since r1, as setting the admin user is a
            # new requirement in r2
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
          resources:
            requests:
              cpu: {{ .Values.grafana.resources.requests.cpu | quote }}
              memory: {{ .Values.grafana.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.grafana.resources.limits.cpu | quote }}
              memory: {{ .Values.grafana.resources.limits.memory | quote }}
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/
            - name: grafana-datasource-prometheus
              mountPath: /etc/grafana/provisioning/datasources/
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-configmap-config
            items:
              - key: "grafana.ini"
                path: "grafana.ini"
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-configmap-config
            items:
              - key: "dashboard-provider.yaml"
                path: "dashboard-provider.yaml"
        - name: grafana-datasource-prometheus
          configMap:
            name: grafana-configmap-config
            items:
              - key: "datasource-prometheus.yaml"
                path: "datasource-prometheus.yaml"
        - name: grafana-dashboards
          configMap:
            name: grafana-configmap-dashboards
            items:
              - key: "node-exporter-full-rev45.json"
                path: "node-exporter-full-rev45.json"
              - key: "custom-dashboard.json"
                path: "custom-dashboard.json"
