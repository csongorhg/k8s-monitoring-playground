apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-kube-state-metrics" (include "monitoring.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: monitoring
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app: kube-state-metrics
spec:
  replicas: {{ .Values.kubeStateMetrics.replicaCount }}
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        app: kube-state-metrics
    spec:
      serviceAccountName: {{ printf "%s-kube-state-metrics-sa" (include "monitoring.fullname" .) | trunc 63 | trimSuffix "-" }}
      containers:
        - name: kube-state-metrics
          image: >-
            {{ printf "%s:%s"
              .Values.kubeStateMetrics.image.repository
              .Values.kubeStateMetrics.image.tag
            }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          resources:
            requests:
              cpu: {{ .Values.kubeStateMetrics.resources.requests.cpu | quote }}
              memory: {{ .Values.kubeStateMetrics.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.kubeStateMetrics.resources.limits.cpu | quote }}
              memory: {{ .Values.kubeStateMetrics.resources.limits.memory | quote }}
