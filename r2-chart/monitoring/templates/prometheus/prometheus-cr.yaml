apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-prometheus-cr" (include "monitoring.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
